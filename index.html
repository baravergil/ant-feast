<style>
:root{--ink:#120e18;--ink2:#1b1524;--panel:#251d31;--panel2:#2f2540;--line:#3b2f4e;
--chalk:#f6f1e8;--dim:#9c8fae;--honey:#ffc24b;--coral:#ff6b6b;--mint:#5be7c4;
--shadow:0 20px 50px rgba(0,0,0,.55);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:radial-gradient(90% 55% at 50% -8%,#3a2857 0%,transparent 62%),
radial-gradient(70% 40% at 50% 108%,#2a1c3d 0%,transparent 60%),var(--ink);
color:var(--chalk);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;
touch-action:none;font-feature-settings:"tnum"}
#app{height:100dvh;height:100vh;display:flex;flex-direction:column;
padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 6px);
max-width:520px;margin:0 auto;gap:6px}
.hud{display:flex;align-items:center;gap:6px}
.chip{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap;
display:flex;align-items:center;gap:5px}
.chip .k{color:var(--dim);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.chip b{font-size:14px;font-weight:900}
.bar{flex:1;height:8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--honey));
transition:width .3s;box-shadow:0 0 12px rgba(255,194,75,.5)}
.ib{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
color:var(--chalk);font-size:15px;display:grid;place-items:center;cursor:pointer;font-family:var(--font)}
.ib:active{transform:scale(.93)}
#stage{flex:1;position:relative;display:grid;place-items:center;min-height:0}
#cv{display:block;border-radius:22px;background:linear-gradient(180deg,#221a2f,#150f20);
border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
#combo{position:absolute;top:12%;left:50%;pointer-events:none;opacity:0;font-size:46px;font-weight:900;
color:var(--honey);text-shadow:0 6px 30px rgba(255,194,75,.55);transform:translate(-50%,0)}
#combo.show{animation:cpop .66s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,14px) scale(.4)}
32%{opacity:1;transform:translate(-50%,-4px) scale(1.18)}
68%{opacity:1;transform:translate(-50%,-12px) scale(1)}
100%{opacity:0;transform:translate(-50%,-40px) scale(.9)}}
#best{position:absolute;top:8px;inset-inline-end:10px;display:none;align-items:center;gap:5px;
background:rgba(18,14,24,.86);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:none}
#best b{font-size:13px;font-weight:900;color:var(--honey)}
#best.beat{border-color:var(--mint)}#best.beat b{color:var(--mint)}
#toast{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateY(8px);
background:rgba(18,14,24,.92);border:1px solid var(--line);padding:7px 14px;border-radius:999px;
font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#tray{display:grid;gap:6px}
.slot{position:relative;aspect-ratio:1/1.05;border-radius:16px;overflow:hidden;
background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;
font-family:var(--font);color:var(--chalk);display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:2px;transition:transform .1s,opacity .2s,border-color .2s}
.slot:active{transform:translateY(2px) scale(.96)}
.slot.fire{animation:fire .36s cubic-bezier(.3,1.6,.4,1)}
@keyframes fire{28%{transform:scaleY(.8) scaleX(1.12)}62%{transform:scaleY(1.07) scaleX(.95)}}
.slot .dome{width:50%;aspect-ratio:1;border-radius:12px;
box-shadow:inset 0 -4px 0 rgba(0,0,0,.26),inset 0 2px 0 rgba(255,255,255,.28)}
.slot .n{font-size:12px;font-weight:900}
.slot .av{font-size:9px;font-weight:800;color:var(--dim)}
.slot .fuel{position:absolute;bottom:0;left:0;height:3px;transition:width .3s}
.slot.dead{opacity:.34}
.slot.tip{border-color:var(--honey);box-shadow:0 0 0 2px rgba(255,194,75,.4)}
.slot.empty{border-style:dashed;opacity:.25}.slot.empty>*{display:none}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ctl{border:1px solid var(--line);background:var(--ink2);color:var(--chalk);border-radius:13px;
padding:10px 4px;font-size:12px;font-weight:800;font-family:var(--font);cursor:pointer}
.ctl:active{transform:scale(.97)}.ctl:disabled{opacity:.32}
.sheet{position:fixed;inset:0;background:rgba(9,6,13,.82);backdrop-filter:blur(9px);display:none;
place-items:center;padding:18px;z-index:20}
.sheet.on{display:grid;animation:fade .22s}@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:350px;border-radius:26px;padding:24px 20px;text-align:center;
background:linear-gradient(180deg,#2e2440,#201829);border:1px solid var(--line);box-shadow:var(--shadow);
animation:rise .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}}
.card h1{font-size:32px;font-weight:900;margin-bottom:2px}
.card .sub{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
color:var(--honey);margin-bottom:14px}
.card h2{font-size:22px;font-weight:900;margin-bottom:6px}
.card p{color:var(--dim);font-size:13.5px;line-height:1.6;margin-bottom:16px}
.big{width:100%;padding:14px;border-radius:15px;border:0;cursor:pointer;font-family:var(--font);
background:linear-gradient(180deg,var(--honey),#ef9f1c);color:#2a1c00;font-weight:900;font-size:16px}
.ghost{width:100%;padding:11px;margin-top:8px;border-radius:15px;cursor:pointer;font-family:var(--font);
background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:800;font-size:13px}
.rows{text-align:start;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;
border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.row:last-child{border-bottom:0}
.sw{position:relative;width:44px;height:26px;border-radius:999px;background:#443754;flex:0 0 44px;
cursor:pointer;border:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
background:#fff;transition:transform .2s}
.sw.on{background:var(--honey)}.sw.on::after{transform:translateX(18px)}
html[dir=rtl] .sw::after{left:auto;right:3px}html[dir=rtl] .sw.on::after{transform:translateX(-18px)}
.seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);font-family:var(--font);font-weight:800;
font-size:12.5px;padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--honey);color:#2a1c00}
.stars{display:flex;justify-content:center;gap:12px;font-size:38px;margin-bottom:12px;line-height:1}
.stars span{color:#463a58;transform:scale(.4);opacity:.35;
transition:transform .4s cubic-bezier(.2,1.9,.4,1),color .3s,opacity .3s}
.stars span.lit{color:var(--honey);transform:scale(1);opacity:1;text-shadow:0 0 24px rgba(255,194,75,.6)}
.stat{display:flex;gap:7px;margin-bottom:16px}
.stat div{flex:1;background:rgba(255,255,255,.055);border-radius:13px;padding:9px 3px}
.stat b{display:block;font-size:18px;font-weight:900;color:var(--honey)}
.stat span{font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.legend{display:flex;flex-direction:column;gap:9px;text-align:start;margin-bottom:16px;
font-size:13px;color:var(--dim);line-height:1.5}
.legend div{display:flex;gap:9px;align-items:flex-start}
.legend .ic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;
flex:0 0 22px;font-size:12px;background:rgba(255,255,255,.07)}
</style></head><body>
<div id="app">
<div class="hud">
<div class="chip"><span class="k" data-t="lvl">Level</span><b id="lvlNum">1</b></div>
<div class="chip"><span class="k" data-t="mv">Moves</span><b id="mvNum">0</b></div>
<div class="chip"><span class="k" data-t="sc">Score</span><b id="scNum">0</b></div>
<div class="bar"><i id="barFill"></i></div>
<button class="ib" id="btnSet">&#9881;</button></div>
<div id="stage"><canvas id="cv"></canvas><div id="combo"></div>
<div id="best"><span data-t="best">Best</span><b id="bestNum">0</b></div><div id="toast"></div></div>
<div id="tray"></div>
<div class="controls">

function nearest(r,g,b,pal){var best=pal[0],bd=1e9;for(var i=0;i<pal.length;i++){
var c=PAL[pal[i]].rgb,d=(c[0]-r)*(c[0]-r)*.9+(c[1]-g)*(c[1]-g)*1.1+(c[2]-b)*(c[2]-b)*.7;
if(d<bd){bd=d;best=pal[i];}}return best;}
function rasterize(ch,S,pal){rc.width=S;rc.height=S;rx.clearRect(0,0,S,S);
rx.textAlign='center';rx.textBaseline='middle';
rx.font=Math.round(S*1.05)+'px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",serif';
rx.fillText(ch,S/2,S*.54);var data;try{data=rx.getImageData(0,0,S,S).data;}catch(e){return null;}
var g=new Array(S*S),filled=0;
for(var i=0;i<S*S;i++){var a=data[i*4+3];
 if(a<130){g[i]=null;continue;}
 var x=i%S,y=(i/S)|0;
 if(x===0||y===0||x===S-1||y===S-1){g[i]=null;continue;}   /* keep a border of air */
 g[i]=nearest(data[i*4],data[i*4+1],data[i*4+2],pal);filled++;}
return filled>=S*S*.18?g:null;}
function fallbackShape(S,pal,rnd){var g=new Array(S*S).fill(null),cx=S/2,cy=S/2;
var lob=[];for(var k=0;k<3;k++)lob.push({x:cx+(rnd()-.5)*S*.3,y:cy+(rnd()-.5)*S*.3,r:S*.44*(.55+rnd()*.45)});
var sd=[];for(var k2=0;k2<pal.length*2;k2++)sd.push({x:rnd()*S,y:rnd()*S,c:pal[k2%pal.length]});
for(var y=1;y<S-1;y++)for(var x=1;x<S-1;x++){
 var inside=false;for(var j=0;j<lob.length;j++)if(Math.hypot(x-lob[j].x,y-lob[j].y)<lob[j].r)inside=true;
 if(!inside)continue;var best=pal[0],bd=1e9;
 for(var m=0;m<sd.length;m++){var d=Math.hypot(x-sd[m].x,y-sd[m].y);if(d<bd){bd=d;best=sd[m].c;}}

/* ---------- reachability ---------- */
function reachable(g,S){
 var air=new Uint8Array(S*S),st=[];
 for(var i=0;i<S;i++){var e=[i,(S-1)*S+i,i*S,i*S+S-1];
  for(var k=0;k<4;k++){var j=e[k];if(!g[j]&&!air[j]){air[j]=1;st.push(j);}}}
 while(st.length){var c=st.pop(),x=c%S,y=(c/S)|0,dd=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var q=0;q<4;q++){var nx=x+dd[q][0],ny=y+dd[q][1];
   if(nx<0||ny<0||nx>=S||ny>=S)continue;var n=ny*S+nx;
   if(!g[n]&&!air[n]){air[n]=1;st.push(n);}}}
 var out=[];
 for(var i2=0;i2<g.length;i2++){if(!g[i2])continue;
  var x2=i2%S,y2=(i2/S)|0,d2=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var q2=0;q2<4;q2++){var ax=x2+d2[q2][0],ay=y2+d2[q2][1];
   if(ax<0||ay<0||ax>=S||ay>=S){out.push(i2);break;}
   if(air[ay*S+ax]){out.push(i2);break;}}}
 return out;}

/* ---------- level ---------- */
function planFor(n){var rnd=mulberry32(n*7919+13);
 var S=n<=10?11:n<=25?12:13;
 var nc=n<=3?3:n<=10?4:n<=25?5:6;
 return {S:S,nc:nc,rnd:rnd};}
function makeLevel(n){var p=planFor(n),S=p.S,rnd=p.rnd;
 var pal=CKEYS.slice();for(var i=pal.length-1;i>0;i--){var j=(rnd()*(i+1))|0;var tmp=pal[i];pal[i]=pal[j];pal[j]=tmp;}
 pal=pal.slice(0,p.nc);
 var g=null,tries=0;
 while(!g&&tries++<5)g=rasterize(EMOJI[(rnd()*EMOJI.length)|0],S,pal);
 if(!g)g=fallbackShape(S,pal,rnd);
 return {S:S,grid:g,rnd:rnd};}
function makeQueue(grid,S,rnd){
 var g=grid.slice(),q=[],guard=0;
 while(g.some(function(c){return c;})&&guard++<3000){
  var R=reachable(g,S);if(!R.length)break;
  var cnt={};R.forEach(function(i){cnt[g[i]]=(cnt[g[i]]||0)+1;});
  var cols=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  var pick=cols[(rnd()*Math.min(2,cols.length))|0];
  var ants=3+((rnd()*6)|0),spent=0,moved=true;
  while(ants>0&&moved){moved=false;var RR=reachable(g,S);
   for(var k=0;k<RR.length;k++){if(ants<=0)break;
    if(g[RR[k]]===pick){g[RR[k]]=null;ants--;spent++;moved=true;}}}
  if(!spent)break;q.push({c:pick,n:spent});}
 var m=[];for(var i=0;i<q.length;i++){var l=m[m.length-1];
  if(l&&l.c===q[i].c&&l.n+q[i].n<=18)l.n+=q[i].n;else m.push({c:q[i].c,n:q[i].n});}
 m.forEach(function(x){x.cap=x.n;});return m;}

 var R={};reachable(G.grid,G.S).forEach(function(i){R[i]=1;});

  ctx.restore();
  if(f.wob>0)f.wob*=.93;if(f.flash>0)f.flash-=.07;if(f.s<1)f.s=Math.min(1,f.s+.08);}}
function drawBurrows(){var by=burrowY(),h=V.burrow;
 ctx.fillStyle='rgba(0,0,0,.26)';ctx.fillRect(0,V.h-h,V.w,h);
 for(var k=0;k<SLOTS;k++){var x=burrowX(k);
  ctx.fillStyle='#2b2338';ctx.beginPath();ctx.ellipse(x,by+h*.18,h*.6,h*.28,0,0,7);ctx.fill();
  ctx.fillStyle='#100c17';ctx.beginPath();ctx.ellipse(x,by+h*.12,h*.28,h*.14,0,0,7);ctx.fill();
  var nest=G.slots[k];
  if(nest){ctx.fillStyle=PAL[nest.c].hex;ctx.globalAlpha=.9;
   ctx.beginPath();ctx.arc(x,by-h*.2,2.6,0,7);ctx.fill();ctx.globalAlpha=1;}}}
function drawAnt(a){var s=V.cell*.05+1;
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.ang);
 ctx.strokeStyle='rgba(255,194,75,.7)';ctx.lineWidth=s*.4;ctx.lineCap='round';
 for(var k=-1;k<=1;k++){var ph=Math.sin(a.leg+k*1.9)*s*.9;
  ctx.beginPath();ctx.moveTo(k*s*.9,0);ctx.lineTo(k*s*.9+ph*.5,-s*1.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(k*s*.9,0);ctx.lineTo(k*s*.9-ph*.5,s*1.7);ctx.stroke();}
 ctx.fillStyle=a.tint;
 ctx.beginPath();ctx.ellipse(-s*2.1,0,s*1.3,s*1.05,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(-s*.2,0,s*.9,s*.78,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(s*1.55,0,s*.98,s*.86,0,0,7);ctx.fill();
 if(a.carry){ctx.fillStyle=PAL[a.carry].hex;rr(s*1.3,-s*2.9,s*2,s*2,s*.5);ctx.fill();}
 ctx.restore();}
function burst(x,y,col,n){for(var k=0;k<(n||6);k++)parts.push({x:x,y:y,vx:rand(-.9,.9),vy:rand(-1.5,-.2),
 rot:rand(0,6),vr:rand(-.25,.25),sz:V.cell*rand(.11,.24),col:col,life:rand(.7,1.1)});}
function confetti(){for(var k=0;k<80;k++)parts.push({x:V.w/2+rand(-V.w*.3,V.w*.3),y:V.h*.32+rand(-26,26),
 vx:rand(-1.7,1.7),vy:rand(-2.7,-.4),rot:rand(0,6),vr:rand(-.3,.3),sz:V.cell*rand(.15,.32),
 col:PAL[CKEYS[(Math.random()*CKEYS.length)|0]].hex,life:rand(1.2,2)});}
var lastChomp=0,chompStep=0;
function eat(i,a){var col=G.grid[i];if(!col)return;
 G.grid[i]=null;if(WAVE)WAVE['delete'](i);
 fx[i]={s:.5,flash:.9,wob:0,at:0};
 var now=performance.now();
 if(now-lastChomp>42){lastChomp=now;chompStep=(chompStep+1)%6;chomp(chompStep+Math.min(4,G.combo));}
 if(a){a.carry=col;setTimeout(function(){a.carry=null;},400);}
 burst(ccx(i),ccy(i),PAL[col].hex,6);
 G.score+=10*Math.max(1,G.combo);
 renderHud();}
function step(dt){
 for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=.05*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.rot+=p.vr*dt;p.life-=.016*dt;if(p.life<=0)parts.splice(i,1);}
 for(var i2=floats.length-1;i2>=0;i2--){var f=floats[i2];f.y-=.05*dt;f.life-=.017*dt;
  if(f.life<=0)floats.splice(i2,1);}
 for(var i3=ants.length-1;i3>=0;i3--){var a=ants[i3],tx,ty;
  if(a.target!=null){if(!G.grid[a.target]){a.target=null;continue;}tx=ccx(a.target);ty=ccy(a.target);}
  else{tx=a.hx;ty=a.hy;}
  var dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy)||1;
  a.wig+=.24*dt;var wig=Math.sin(a.wig)*a.wa;
  a.x+=(dx/d*a.spd-dy/d*wig)*dt;a.y+=(dy/d*a.spd+dx/d*wig)*dt;
  a.ang=Math.atan2(dy,dx);a.leg+=.5*dt*a.spd;
  if(d<V.cell*.6){if(a.target!=null){eat(a.target,a);a.target=null;}
   else if(!a.live)ants.splice(i3,1);}}
 if(shake>0)shake=Math.max(0,shake-.05*dt);}
var lastT=0;
function loop(ts){var raw=Math.min(3,(ts-lastT)/16.67)||1;lastT=ts;
 step(raw*timeScale);
 ctx.clearRect(0,0,V.w,V.h);ctx.save();
 if(shake>0){var m=shake*V.cell*.22;ctx.translate(rand(-m,m),rand(-m,m));}
 drawBoard(ts);drawBurrows();
 for(var i=0;i<ants.length;i++)drawAnt(ants[i]);
 for(var j=0;j<parts.length;j++){var p=parts[j];ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore();}
 ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
 for(var k=0;k<floats.length;k++){var f=floats[k];
  ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));
  ctx.font='900 '+f.sz+'px '+getComputedStyle(document.body).fontFamily;
  ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
 ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(loop);}

function startLevel(n){
 G.gen++;WAVE=null;G.busy=false;queuedTap=null;drag=null;
 G.level=n;
 var lv=makeLevel(n);
 G.S=lv.S;G.grid=lv.grid;
 G.queue=makeQueue(G.grid,G.S,lv.rnd);
 G.qi=0;G.slots=[];G.history=[];G.moves=0;G.score=0;G.combo=0;
 G.total=G.grid.filter(function(c){return c;}).length;
 G.par=G.queue.length;
 G.parScore=G.total*30;
 ants=[];parts=[];floats=[];shake=0;timeScale=1;
 var t0=performance.now();
 fx=G.grid.map(function(c,i){return {s:0,flash:0,wob:0,at:t0+((i%G.S)+((i/G.S)|0))*16};});
 for(var i=0;i<SLOTS;i++)G.slots.push(take());
 G.best=parseInt(store.get('af5_best_'+n)||'0',10)||0;
 layout();renderAll();store.set('af5_level',n);}
function take(){var q=G.queue[G.qi];return q?{c:q.c,n:q.n,cap:q.cap,ord:G.qi++}:null;}
function reachSet(){var s={};reachable(G.grid,G.S).forEach(function(i){s[i]=1;});return s;}
function visCounts(){var m={},R=reachable(G.grid,G.S);
 R.forEach(function(i){m[G.grid[i]]=(m[G.grid[i]]||0)+1;});return m;}
function renderTray(){var tray=$('#tray'),vis=visCounts();
 tray.style.gridTemplateColumns='repeat('+SLOTS+',1fr)';
 tray.innerHTML='';
 G.slots.forEach(function(nest,idx){
  var el=document.createElement('button');
  el.className='slot'+(nest?'':' empty')+(nest&&!vis[nest.c]?' dead':'');
  if(nest){var pct=Math.round(nest.n/nest.cap*100);
   el.innerHTML='<span class="dome" style="background:'+PAL[nest.c].hex+'"></span>'+
    '<span class="n">'+nest.n+'</span>'+
    '<span class="av">'+(vis[nest.c]||0)+'</span>'+
    '<span class="fuel" style="width:'+pct+'%;background:'+PAL[nest.c].lit+'"></span>';
   el.addEventListener('click',function(){activate(idx);});}
  else el.disabled=true;
  tray.appendChild(el);});}
function renderHud(){var left=G.grid.filter(function(c){return c;}).length;
 $('#barFill').style.width=(G.total?Math.round((1-left/G.total)*100):0)+'%';
 $('#lvlNum').textContent=G.level;$('#mvNum').textContent=G.moves;$('#scNum').textContent=G.score;
 $('#btnUndo').disabled=!G.history.length||G.busy;
 var bw=$('#best');
 if(G.best>0){bw.style.display='flex';$('#bestNum').textContent=G.best;
  bw.classList.toggle('beat',G.score>G.best);}else bw.style.display='none';}
function renderAll(){renderTray();renderHud();}
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('on');
 clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},1800);}
function snapshot(){G.history.push({grid:G.grid.slice(),slots:G.slots.map(function(s){return s?{c:s.c,n:s.n,cap:s.cap,ord:s.ord}:null;}),
 qi:G.qi,moves:G.moves,score:G.score,queue:G.queue.map(function(q){return {c:q.c,n:q.n,cap:q.cap};})});
 if(G.history.length>30)G.history.shift();}
function spawnAnts(idx,color,count){
 var idle=ants.filter(function(a){return a.target==null&&a.live;}).length;
 var need=Math.max(0,Math.min(count,24)-idle);
 var hx=burrowX(idx),hy=burrowY();
 ants.forEach(function(a){a.hx=hx;a.hy=hy;});
 for(var k=0;k<need;k++)ants.push({x:hx+rand(-7,7),y:hy+rand(-4,4),hx:hx,hy:hy,target:null,carry:null,
  ang:-Math.PI/2,leg:rand(0,6),spd:V.cell*rand(.5,.68),wig:rand(0,6),wa:V.cell*rand(.012,.03),
  tint:Math.random()<.16?PAL[color].lit:'#ffc24b',live:true});}
function assign(list){var free=ants.filter(function(a){return a.target==null&&a.live;});
 var i=0;for(var k=0;k<free.length&&i<list.length;k++)free[k].target=list[i++];return list.slice(i);}
function activate(idx){
 if(G.busy){queuedTap={idx:idx,at:performance.now()};return;}
 var nest=G.slots[idx];if(!nest)return;
 var vis=visCounts();
 if(!vis[nest.c]){tone(140,.13,.05,'square');shake=.5;toast(t('blocked'));haptic([12]);return;}
 G.busy=true;var gen=G.gen;snapshot();G.moves++;G.combo=0;ac();
 var trayEl=$('#tray').children[idx];if(trayEl)trayEl.classList.add('fire');
 (function run(){
  var chain=Promise.resolve();
  chain=chain.then(function step2(){
   if(gen!==G.gen)return;
   if(nest.n<=0)return;
   var R=reachable(G.grid,G.S).filter(function(i){return G.grid[i]===nest.c;});
   if(!R.length)return;
   var list=R.slice(0,nest.n);
   nest.n-=list.length;G.combo++;
   list.forEach(function(i){fx[i].wob=1;});
   if(G.combo>1){var cb=$('#combo');cb.textContent='\u00d7'+G.combo;cb.classList.remove('show');
    void cb.offsetWidth;cb.classList.add('show');
    tone(430*Math.pow(1.13,Math.min(12,G.combo)),.2,.05);
    if(G.combo===3||G.combo===5||G.combo===8)haptic([45,25,45]);}
   renderTray();
   spawnAnts(idx,nest.c,list.length);
   WAVE=new Set(list);
   var left=assign(list);
   var t0=performance.now();
   return (function wait(){
    if(gen!==G.gen)return;
    if(WAVE&&WAVE.size&&performance.now()-t0<900)
     return sleep(16).then(function(){if(left.length)left=assign(left);return wait();});
    if(WAVE&&WAVE.size)WAVE.forEach(function(j){eat(j,null);});
    WAVE=null;
    shake=Math.min(1.5,.4+list.length*.04);
    var bonus=list.length*list.length*2*G.combo;
    G.score+=bonus;
    floats.push({x:V.w/2,y:V.h*.45,txt:'+'+(list.length*10*G.combo+bonus),
     sz:Math.max(13,V.cell*.8),col:list.length>=8?'#5be7c4':'#ffc24b',life:1.1});
    if(list.length>=8){haptic([35,20,35]);tone(720+list.length*12,.22,.06,'triangle');}
    return sleep(70).then(step2);
   })();
  });
  chain['catch'](function(e){console.error(e);}).then(function(){
   if(gen!==G.gen)return;
   WAVE=null;ants.forEach(function(a){a.target=null;a.live=false;});
   if(nest.n<=0){G.slots[idx]=take();tone(880,.14,.05,'sine');tone(1320,.12,.035,'sine',.07);}
   G.busy=false;renderAll();checkEnd();
   if(queuedTap){var q=queuedTap;queuedTap=null;
    if(performance.now()-q.at<900&&!G.busy&&G.slots[q.idx])activate(q.idx);}
  });
 })();}
function rescue(){var alive=G.slots.map(function(s,i){return {s:s,i:i};})
  .filter(function(x){return x.s;}).sort(function(a,b){return a.s.ord-b.s.ord;})[0];
 if(!alive)return false;
 G.queue.push({c:alive.s.c,n:alive.s.n,cap:alive.s.cap});
 G.slots[alive.i]=take();G.score=Math.max(0,G.score-60);
 tone(200,.3,.06,'sawtooth');shake=.9;renderAll();toast(t('jam'));return true;}
function checkEnd(){
 var left=G.grid.filter(function(c){return c;}).length;
 if(left===0){win();return;}
 var vis=visCounts();
 var any=G.slots.some(function(s){return s&&vis[s.c];});
 if(!any){if(rescue())setTimeout(checkEnd,80);}}
function win(){
 confetti();shake=1.4;
 [523,659,784,1046].forEach(function(f,i){tone(f,.36,.06,'triangle',i*.09);});
 var ratio=G.score/Math.max(1,G.parScore);
 var stars=ratio>=1.15?3:ratio>=.85?2:1;
 G.stars=stars;G.score+=stars*150;
 var prev=G.best,isNew=G.score>prev;
 if(isNew){store.set('af5_best_'+G.level,G.score);G.best=G.score;}
 $('#stScore').textContent=G.score;$('#stMoves').textContent=G.moves;
 $('#stBest').textContent=Math.max(G.score,prev);
 $('#winTitle').textContent=(isNew&&prev>0)?t('record'):(stars===3?t('perfect'):t('cleared'));
 $('#winSub').textContent=stars===3?t('subPerfect'):t('subOk');
 if(G.level+1>G.maxLevel){G.maxLevel=G.level+1;store.set('af5_max',G.maxLevel);}
 var els=document.querySelectorAll('#stars span');
 for(var i=0;i<els.length;i++)els[i].classList.remove('lit');
 setTimeout(function(){$('#shWin').classList.add('on');
  for(var i=0;i<stars;i++)(function(i){setTimeout(function(){
   els[i].classList.add('lit');tone(660+i*220,.22,.06);haptic([30,20,30]);},250+i*280);})(i);
 },560);}
function undo(){if(G.busy||!G.history.length)return;
 G.gen++;WAVE=null;queuedTap=null;
 var s=G.history.pop();
 G.grid=s.grid;G.slots=s.slots;G.qi=s.qi;G.moves=s.moves;G.score=s.score;G.queue=s.queue;
 fx=G.grid.map(function(c){return {s:c?1:0,flash:.3,wob:0,at:0};});
 ants=[];renderAll();tone(300,.12,.05,'sine');}
var hintT=null;
function hint(){if(G.busy)return;
 var els=document.querySelectorAll('.slot.tip');
 for(var i=0;i<els.length;i++)els[i].classList.remove('tip');
 clearTimeout(hintT);
 var bi=-1,bs=-1;
 G.slots.forEach(function(nest,idx){if(!nest)return;
  var g=G.grid.slice(),n=nest.n,total=0,combo=0;
  while(n>0){var R=reachable(g,G.S).filter(function(i){return g[i]===nest.c;});
   if(!R.length)break;var take2=R.slice(0,n);combo++;
   take2.forEach(function(i){g[i]=null;});n-=take2.length;total+=take2.length*combo;}
  if(total>bs){bs=total;bi=idx;}});
 if(bi<0)return;
 var el=$('#tray').children[bi];if(el)el.classList.add('tip');
 tone(760,.1,.045,'sine');
 hintT=setTimeout(function(){if(el)el.classList.remove('tip');},2600);}
function applyLang(){
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==='he'?'rtl':'ltr';
 var els=document.querySelectorAll('[data-t]');
 for(var i=0;i<els.length;i++)els[i].textContent=t(els[i].getAttribute('data-t'));
 document.title=t('title');
 $('#legend').innerHTML=[['\ud83d\udc1c','l1'],['\ud83e\uddf1','l2'],['\u2728','l3']].map(function(p){
  return '<div><span class="ic">'+p[0]+'</span><span>'+t(p[1])+'</span></div>';}).join('');
 $('#lgEn').classList.toggle('on',LANG==='en');$('#lgHe').classList.toggle('on',LANG==='he');
 renderTray();}
function setLang(l){LANG=l;store.set('af5_lang',l);applyLang();}
$('#lgEn').onclick=function(){setLang('en');};
$('#lgHe').onclick=function(){setLang('he');};
$('#btnPlay').onclick=function(){$('#shStart').classList.remove('on');ac();tone(660,.12,.05);};
$('#btnUndo').onclick=undo;$('#btnHint').onclick=hint;
$('#btnReset').onclick=function(){startLevel(G.level);};
$('#btnNext').onclick=function(){$('#shWin').classList.remove('on');startLevel(G.level+1);};
$('#btnReplay').onclick=function(){$('#shWin').classList.remove('on');startLevel(G.level);};
$('#btnSet').onclick=function(){$('#setMax').textContent=G.maxLevel;$('#shSet').classList.add('on');};
$('#btnClose').onclick=function(){$('#shSet').classList.remove('on');};
$('#swSound').onclick=function(e){G.sound=!G.sound;e.currentTarget.classList.toggle('on',G.sound);

$('#swHap').onclick=function(e){G.haptic=!G.haptic;e.currentTarget.classList.toggle('on',G.haptic);
 store.set('af5_hap',G.haptic?1:0);if(G.haptic)haptic([30]);};
$('#btnJump').onclick=function(){var v=parseInt(prompt(t('jumpQ'),G.level),10);
 if(v>=1&&v<=999){$('#shSet').classList.remove('on');
  if(v>G.maxLevel){G.maxLevel=v;store.set('af5_max',v);}startLevel(v);}};
document.addEventListener('keydown',function(e){
 if(e.key>='1'&&e.key<='4')activate(+e.key-1);
 if(e.key&&e.key.toLowerCase()==='u')undo();
 if(e.key&&e.key.toLowerCase()==='h')hint();});
var rt=null;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120);});
window.addEventListener('orientationchange',function(){setTimeout(layout,320);});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
/* A service worker from an earlier build would serve the old game from cache.
   Remove it so this version actually loads. */
if('serviceWorker' in navigator){try{
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});
  if(window.caches&&caches.keys)caches.keys().then(function(ks){ks.forEach(function(k){caches['delete'](k);});}).catch(function(){});
}catch(e){}}
(function boot(){
 var l=store.get('af5_lang');
 LANG=l||((navigator.language||'en').toLowerCase().indexOf('he')===0?'he':'en');
 G.maxLevel=parseInt(store.get('af5_max')||'1',10)||1;
 var sv=parseInt(store.get('af5_level')||'1',10)||1;
 var s=store.get('af5_sound');if(s!==null)G.sound=s=='1';
 var h=store.get('af5_hap');if(h!==null)G.haptic=h=='1';
 $('#swSound').classList.toggle('on',G.sound);$('#swHap').classList.toggle('on',G.haptic);
 applyLang();startLevel(sv);requestAnimationFrame(loop);setTimeout(layout,90);
})();
