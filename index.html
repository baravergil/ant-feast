rgba(18,14,24,.92);border:1px solid var(--line);color:var(--chalk);padding:8px 16px;border-radius:999px;font-size:11px;font-weight:800;opacity:0;transition:all .25s;pointer-events:none;z-index:15}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><div id="app"><div class="hud"><div><span>Level</span><b id="lvlNum">1</b></div><div id="mvChip"><span>Moves</span><b id="mvNum">0</b></div><div id="scChip"><span>Score</span><b id="scNum">0</b></div><div class="bar"><i id="barFill"></i></div><button class="ib" id="btnSet">⚙</button></div><div class="goal" id="goal"></div><div id="stage"><canvas id="cv"></canvas><div id="combo"></div><div id="bests"></div><div id="warning">WATCH OUT!</div></div><div id="tray"></div><div class="controls"><button class="ctl" id="btnUndo">Undo</button><button class="ctl" id="btnHint">Hint</button><button class="ctl" id="btnReset">Restart</button></div></div><div class="sheet on" id="shStart"><div class="card"><h1>Ant Feast</h1><p>A swarm eats pixel art. Build combos. Chain for bonuses!</p><button class="big" id="btnPlay">Play</button></div></div><div class="sheet" id="shWin"><div class="card"><h2 id="winTitle"></h2><p id="winSub"></p><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div><div class="stat"><div><b id="stScore">0</b><span>Score</span></div><div><b id="stMoves">0</b><span>Moves</span></div><div><b id="stBest">0</b><span>Best</span></div></div><button class="big" id="btnNext">Next</button><button class="ghost" id="btnReplay">Replay</button></div></div><div class="sheet" id="shFail"><div class="card"><h2>Game Over</h2><p id="failMsg"></p><button class="big" id="btnUndo2">Undo</button><button class="ghost" id="btnReset2">Restart</button></div></div><div class="sheet" id="shSet"><div class="card"><h2>Settings</h2><div style="text-align:start;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--l
